# dsh-chat 的加载补丁：把插件插入 profile 的插件树。
#
#   - insert: 在当前层级的插件列表末尾追加条目
#     - id:    该补丁行的稳定标识（去重、定位、覆写配置都用它）
#       name:  要加载的 npm 包名（必须与本包 package.json 的 name 一致）
#       config: 可选，传给 apply(ctx, config) 的对象
#
# 安装方式见 README.md「安装到 DSH」。默认配置下：
#   * 不贡献任何带宽/存储，不对外发送任何会话内容；
#   * 节点只监听本机回环地址；
#   * 所有分享与直播都必须由用户在界面中逐会话显式授权。
- insert:
    - id: dsh-chat
      name: dsh-chat
